<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; text-align: center; padding: 50px; }
        .card { background: white; max-width: 350px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 5px solid #007bff; }
        h2 { color: #333; }
        .info { text-align: left; margin: 15px 0; font-size: 16px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏢 Employee Dashboard</h2>
        <hr>
        <div class="info">
            <p><strong>👤 Name:</strong> Amit Kumar</p>
            <p><strong>💼 Role:</strong> Java Developer</p>
            <p><strong>💰 Salary:</strong> ₹45,000/month</p>
        </div>
    </div>
</body>
</html>
